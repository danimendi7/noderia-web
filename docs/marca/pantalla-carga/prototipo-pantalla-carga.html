<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoderIA — Prototipo pantalla de carga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{
    --midnight:#00102C; --royal:#0030C0; --electric:#0068E0; --sky:#00B0F0; --aqua:#00E5F0; --mist:#F4F7FB;
    --grad:linear-gradient(120deg,var(--royal) 0%,var(--electric) 40%,var(--sky) 75%,var(--aqua) 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,system-ui,sans-serif;background:var(--midnight);color:#fff;overflow:hidden}

  /* ---------- HERO (debajo del loader) ---------- */
  .hero{position:relative;height:100vh;min-height:560px;overflow:hidden;
    background:radial-gradient(60% 70% at 72% 50%, rgba(0,72,200,.55) 0%, rgba(0,40,130,.25) 40%, rgba(0,16,44,0) 75%), var(--midnight);}
  nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:28px 6vw}
  nav img{height:34px;display:block}
  nav ul{display:flex;gap:32px;list-style:none;align-items:center;font-size:15px;color:#C9D6EE}
  nav .btn{padding:10px 20px}
  .btn{font-family:Inter;font-weight:600;font-size:15px;border:0;border-radius:12px;cursor:pointer;color:#fff;
    background:var(--grad);padding:14px 26px;box-shadow:0 8px 30px rgba(0,104,224,.35)}
  .link{color:var(--aqua);font-weight:600;font-size:15px;text-decoration:none}
  .hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr 1fr;gap:3vw;align-items:center;padding:4vh 6vw 0;height:calc(100% - 100px)}
  .label{font-family:Inter;font-weight:600;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--aqua);margin-bottom:22px}
  h1{font-family:Outfit;font-weight:800;font-size:clamp(38px,5vw,68px);line-height:1.04;letter-spacing:-.01em;margin-bottom:22px}
  h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:18px;line-height:1.5;color:#B8C7E2;max-width:520px;margin-bottom:34px}
  .ctas{display:flex;gap:28px;align-items:center}
  .scene{position:relative;width:100%;aspect-ratio:1/0.85}
  .scene svg{width:100%;height:100%;overflow:visible}
  .scene-note{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font-size:12px;color:#6F84AA;letter-spacing:.04em}
  .hero-in{opacity:0}

  /* ---------- LOADER ---------- */
  #loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    background:radial-gradient(45% 55% at 50% 50%, rgba(0,70,210,.55) 0%, rgba(0,35,120,.28) 45%, rgba(0,16,44,0) 80%), var(--midnight)}
  #loader .halo{position:absolute;width:60vmin;height:60vmin;border-radius:50%;
    background:radial-gradient(circle, rgba(0,229,240,.18) 0%, rgba(0,104,224,0) 65%);opacity:0}
  #mark{width:min(34vmin,320px);height:auto;overflow:visible}
  #skip{position:absolute;right:28px;bottom:24px;background:none;border:1px solid rgba(255,255,255,.18);color:#9FB2D4;
    font:500 13px Inter;padding:8px 14px;border-radius:12px;cursor:pointer}
  #skip:hover{color:#fff;border-color:rgba(255,255,255,.4)}

  /* ---------- Panel de control del prototipo ---------- */
  .proto{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;gap:8px;align-items:center;
    background:rgba(0,16,44,.82);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px}
  .proto span{font-size:12px;color:#7F93B8;padding:0 6px}
  .proto button{font:600 12px Inter;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
    border-radius:8px;padding:7px 11px;cursor:pointer}
  .proto button.on{background:var(--electric);border-color:var(--electric)}

  @media (max-width:860px){
    nav ul li:not(:last-child){display:none}
    .hero-grid{grid-template-columns:1fr;padding-top:2vh}
    .scene{max-width:440px;margin:0 auto}
    .sub{font-size:16px}
  }
</style>
</head>

<div class="proto">
  <span>Prototipo</span>
  <button id="replay">↻ Repetir</button>
  <button id="slow">Cámara lenta</button>
</div>

<script>
(function(){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const loader = document.getElementById('loader');
  const SLOPE = 9;                                   // suavidad del borde que avanza
  const funcs = ['fr','fg','fb'].map(id => document.getElementById(id));
  let tl, slow = false;

  // Pulso que recorre las conexiones del boceto del hero
  const segs = ['c1','c2','c3','c4','c5'].map(id => document.getElementById(id));
  const pulse = document.getElementById('pulse');
  const pulseState = {t:0};
  gsap.to(pulseState, {t:segs.length, duration:7, ease:'none', repeat:-1, onUpdate(){
    const i = Math.min(Math.floor(pulseState.t), segs.length-1), s = segs[i];
    const p = s.getPointAtLength((pulseState.t - i) * s.getTotalLength());
    pulse.setAttribute('cx', p.x); pulse.setAttribute('cy', p.y);
  }});

  function build(){
    if (tl) tl.kill();
    gsap.set(loader, {autoAlpha:1, display:'grid'});
    gsap.set('.hero-in', {opacity:0, y:16});
    gsap.set(funcs, {attr:{intercept: SLOPE * -0.12}});
    gsap.set('#ribbon', {attr:{mask:'url(#reveal)'}});
    gsap.set('#logoGroup', {scale:1, opacity:1, svgOrigin:'593 406'});
    gsap.set('#shine', {x:0, opacity:0});
    gsap.set('.halo', {opacity:0, scale:.6});
    gsap.set('.ballGlow', {opacity:.35});
    const vw = Math.max(window.innerWidth, 900) * 1187 / document.getElementById('mark').getBoundingClientRect().width;
    gsap.set('#ballBL', {x:-vw*0.75, y:120, scale:.7});
    gsap.set('#ballTR', {x: vw*0.75, y:-120, scale:.7});

    tl = gsap.timeline({onComplete:()=>gsap.set(loader,{display:'none'})});
    tl.to('.halo', {opacity:1, scale:1, duration:.6, ease:'power2.out'}, 0)
      // 1. Las dos esferas entran desde lados opuestos
      .to('#ballBL', {x:0, y:0, scale:1, duration:.75, ease:'back.out(1.15)'}, 0.05)
      .to('#ballTR', {x:0, y:0, scale:1, duration:.75, ease:'back.out(1.15)'}, 0.12)
      // 2. La cinta se dibuja de una esfera a la otra
      .to(funcs, {attr:{intercept: SLOPE * 1.12}, duration:.85, ease:'power1.inOut'}, 0.70)
      .to('.ballGlow', {opacity:0, duration:.5}, 0.9)
      // 3. Logo oficial completo, sin máscara, y destello
      .set('#ribbon', {attr:{mask:''}}, 1.56)
      .to('#shine', {opacity:1, duration:.01}, 1.5)
      .to('#shine', {x:2000, duration:.7, ease:'power1.inOut'}, 1.5)
      // 4. Salida hacia el hero
      .to('#logoGroup', {scale:.92, opacity:0, duration:.4, ease:'power2.in'}, 2.15)
      .to(loader, {autoAlpha:0, duration:.45, ease:'power1.out'}, 2.25)
      .to('.hero-in', {opacity:1, y:0, duration:.6, stagger:.07, ease:'power2.out'}, 2.35);
    tl.timeScale(slow ? .3 : 1);
  }

  function skip(){ if (tl) tl.progress(1); gsap.set(loader,{display:'none'}); gsap.set('.hero-in',{opacity:1,y:0}); }

  document.getElementById('skip').onclick = skip;
  document.getElementById('replay').onclick = build;
  document.getElementById('slow').onclick = function(){ slow = !slow; this.classList.toggle('on', slow); build(); };

  // En la web real: solo la primera visita de la sesión y nunca con "reducir movimiento"
  const start = () => reduce ? skip() : build();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
